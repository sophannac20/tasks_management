<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task Records</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Task Records">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root { --bg: #f4f6f9; --text: #1c2430; --muted: #6b7686; --accent: #2f6fed; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1319; --text: #e6ebf2; --muted: #8b97a8; } }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #splash { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 14px; background: var(--bg); color: var(--text);
            font: 12px ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; transition: opacity .35s ease; }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash .logo { width: 72px; height: 72px; border-radius: 20px; background: var(--accent); color: #fff; display: flex;
                  align-items: center; justify-content: center; font-size: 38px; font-weight: 700;
                  box-shadow: 0 8px 24px rgba(47,111,237,.35); animation: pop .5s ease both; }
  #splash b { font-size: 15px; letter-spacing: .02em; }
  #splash small { color: var(--muted); }
  .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(127,127,127,.25); overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: var(--accent); border-radius: 3px; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .bar i, #splash .logo { animation: none; } }
</style>
</head>
<body>
<div id="splash">
  <div class="logo">T</div>
  <b>Task Records</b>
  <div class="bar"><i></i></div>
  <small id="sub">Loading...</small>
</div>
<iframe id="app" title="Task Records" allow="camera; clipboard-write"></iframe>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  var APP_URL = "https://script.google.com/macros/s/AKfycbxjv5n87CIGdAOGQKP5TSfjsvVr1Qh4_3esZ3rrESs3hYOOcCZ66BbseFDduO6doB-JSQ/exec";
  // Inside Telegram, pass the signed launch data to the app so the bot can send exported files to this user
  (function(){
    var src = APP_URL, tg = window.Telegram && window.Telegram.WebApp;
    try { if (tg) { tg.ready(); if (tg.initData) src += '#tgWebAppData=' + encodeURIComponent(tg.initData); } } catch (e) {}
    document.getElementById('app').src = src;
  })();
</script>
<script>
  var t0 = Date.now(), loaded = false;
  function hideSplash(){
    var s = document.getElementById('splash'); if (!s) return;
    s.classList.add('hide'); setTimeout(function(){ if (s.parentNode) s.remove(); }, 450);
  }
  // keep the splash at least 700 ms so it never just flashes
  document.getElementById('app').addEventListener('load', function(){
    loaded = true; setTimeout(hideSplash, Math.max(0, 700 - (Date.now() - t0)));
  });
  setTimeout(function(){ if (!loaded) document.getElementById('sub').textContent = 'Still loading... check your connection'; }, 8000);
  setTimeout(hideSplash, 20000);
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
</script>
</body>
</html>
